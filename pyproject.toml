[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-simulator"
version = "1.0.0"
description = "Playable blackjack table, basic strategy engine, card counter, bots and Monte Carlo tools"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.18",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "black>=23.0", "flake8>=6.0", "nbformat>=5.9", "nbclient>=0.8", "notebook>=7.0"]

[project.scripts]
blackjack = "blackjack.cli:main"

[tool.setuptools.packages.find]
include = ["blackjack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long Monte Carlo runs (deselect with '-m \"not slow\"')",
]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py310"]
